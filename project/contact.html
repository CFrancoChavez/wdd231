<head>

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.ico">

  <meta property="og:title" content="DevCraft Portfolio">
  <meta property="og:description" content="Showcasing my work in software development.">

<body>

  <header>
    <img src="images/devcraft-logo.png" alt="logo">
    <h1>DevCraft Portfolio</h1>
    
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="hamburger">☰
     
    </div>
  </header>
<main id="contactus">

    <!-- Contact Page -->
    <section class="contact-form">
      <h2>Contact Us</h2>
      <form id="contact" action="thankyou.html">
          <!-- First Name -->
           <!-- Applicant First Name -->
           <label for="firstName">First Name:
            <input type="text" id="firstName" name="firstName" title="Enter your first name" required
                autocomplete="given-name">
        </label>

        <!-- Applicant Last Name -->
        <label for="lastName">Last Name:
            <input type="text" id="lastName" name="lastName" title="Enter your last name" required
                autocomplete="family-name">
        </label>

        <!-- Organizational Title -->
        <label for="orgTitle">Organizational Title:
            <input type="text" id="orgTitle" name="orgTitle" title="Enter your title within the organization"
                autocomplete="organization-title" pattern="^[A-Za-z\s-]{7,}$">
        </label>

        <!-- Email Address -->
        <label for="email">Email:
            <input type="email" id="email" name="email" title="Enter your email address" required
                autocomplete="email" placeholder="example@domain.com">
        </label>

        <!-- Mobile Phone Number -->
        <label for="phone">Mobile Phone:
            <input type="tel" id="phone" name="phone" title="Enter your mobile phone number" required
                autocomplete="tel">
        </label>

        <!-- Business/Organization Name -->
        <label for="orgName">Organization Name:
            <input type="text" id="orgName" name="orgName" title="Enter your organization's name" required
                autocomplete="organization">
        </label>
        <!-- Organization Description -->
        <label for="description">Organization Description:
          <textarea id="description" name="description" title="Describe your organization"></textarea>
      </label>

      <!-- Hidden Timestamp -->
      <input type="hidden" name="timestamp" id="timestamp">

      <!-- Submit Button -->
      <input type="submit" value="Send">

      </form>
  </section>
   


</main>

  <footer>
    <p>© 2024 DevCraft. All rights reserved.</p>
    <div class="social-media">
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
      <a href="#"><img src="images/face.png" alt="Twitter"></a>
      <a href="#"><img src="images/linkedin.jpg" alt="LinkedIn"></a>
    </div>
  
    <p>Last modification: <span id="lastModified"></span></p>
  </footer>
  <script src="scripts/hamburguer.js" defer></script>
  <script src="scripts/formHandler.js" defer></script>
  <script src="scripts/GetDate.js" defer></script>
  
</body>
</html>
